<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%" role="img" aria-label="Jörg Thode — Fullstack Developer, PSPO I und Gründer von Micro KI+">
  <defs>
    <pattern id="scanlines" width="1200" height="4" patternUnits="userSpaceOnUse">
      <rect width="1200" height="2" fill="#000000" fill-opacity="0.22"/>
    </pattern>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.025"/>
    </pattern>
    <style>
      .mono { font-family: 'VT323', 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', 'Courier New', monospace; }
      .cursor { animation: blink 1.2s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Outer CRT Frame -->
  <rect width="1200" height="280" rx="10" fill="#060709" stroke="#22262c" stroke-width="2"/>
  <rect x="6" y="6" width="1188" height="268" rx="7" fill="#080a0d" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>
  <rect x="6" y="6" width="1188" height="268" rx="7" fill="url(#grid)"/>

  <!-- Top Terminal Bar (Calm Monochrome) -->
  <rect x="6" y="6" width="1188" height="34" rx="6" fill="#0e1116"/>
  <line x1="6" y1="40" x2="1194" y2="40" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="26" cy="23" r="4.5" fill="#4a525d"/>
  <circle cx="42" cy="23" r="4.5" fill="#4a525d"/>
  <circle cx="58" cy="23" r="4.5" fill="#4a525d"/>
  <text x="80" y="27" class="mono" font-size="12.5" fill="#8b949e" letter-spacing="1.4">JÖRG THODE // FULLSTACK DEVELOPER &amp; FOUNDER OF MICRO KI+ — MAINZ, DE</text>
  <text x="1172" y="27" class="mono" font-size="12.5" fill="#8b949e" text-anchor="end" letter-spacing="1">SEIT 1999 · PHP 8.5 · SYMFONY 7.4 · PSPO I</text>

  <!-- Centered Identity -->
  <g transform="translate(600, 92)">
    <text x="0" y="0" class="mono" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3.5">JÖRG THODE</text>
    <rect x="155" y="-28" width="8" height="27" fill="#ffffff" class="cursor"/>

    <text x="0" y="32" class="mono" font-size="16" font-weight="bold" fill="#e6edf3" text-anchor="middle" letter-spacing="0.8">Gründer von Micro KI+ · Fullstack-Entwickler · Scrum.org Product Owner (PSPO I)</text>
    <text x="0" y="56" class="mono" font-size="13.5" fill="#8b949e" text-anchor="middle" letter-spacing="0.4">25+ Jahre Webentwicklung, Enterprise-E-Commerce, Systemintegration &amp; deterministische KI-Werkzeuge aus Mainz.</text>
  </g>

  <!-- Symmetrical 3-Column Focus Bar -->
  <g transform="translate(32, 174)">
    <rect width="360" height="76" rx="6" fill="#0d1015" stroke="#262c34" stroke-width="1"/>
    <rect x="0" y="0" width="360" height="2.5" rx="1.2" fill="#ffffff"/>
    <text x="18" y="26" class="mono" font-size="13" font-weight="bold" fill="#ffffff" letter-spacing="1">MICRO KI+ (GRÜNDER &amp; INHABER)</text>
    <text x="18" y="48" class="mono" font-size="12" fill="#8b949e">Parser API KI+ · Bewerber Tool KI+ ·</text>
    <text x="18" y="64" class="mono" font-size="12" fill="#8b949e">Fake Checker KI+ (Hosting in Deutschland)</text>
  </g>

  <g transform="translate(420, 174)">
    <rect width="360" height="76" rx="6" fill="#0d1015" stroke="#262c34" stroke-width="1"/>
    <rect x="0" y="0" width="360" height="2.5" rx="1.2" fill="#00e8ff"/>
    <text x="18" y="26" class="mono" font-size="13" font-weight="bold" fill="#ffffff" letter-spacing="1">ARCHITEKTUR &amp; TESTSTANDARDS</text>
    <text x="18" y="48" class="mono" font-size="12" fill="#8b949e">PHP 8.5 · Symfony 7.4 · 100 % Coverage ·</text>
    <text x="18" y="64" class="mono" font-size="12" fill="#8b949e">123 Golden-Master-Fixtures · Mutation Tests</text>
  </g>

  <g transform="translate(808, 174)">
    <rect width="360" height="76" rx="6" fill="#0d1015" stroke="#262c34" stroke-width="1"/>
    <rect x="0" y="0" width="360" height="2.5" rx="1.2" fill="#00ff41"/>
    <text x="18" y="26" class="mono" font-size="13" font-weight="bold" fill="#ffffff" letter-spacing="1">E-COMMERCE &amp; INTEGRATION</text>
    <text x="18" y="48" class="mono" font-size="12" fill="#8b949e">Shopware 6 · Symfony-Middleware · REST/EDI ·</text>
    <text x="18" y="64" class="mono" font-size="12" fill="#8b949e">ERP/PIM-Anbindung · n8n &amp; Make Automation</text>
  </g>

  <!-- Scanlines -->
  <rect x="6" y="6" width="1188" height="268" rx="7" fill="url(#scanlines)" pointer-events="none"/>
</svg>
